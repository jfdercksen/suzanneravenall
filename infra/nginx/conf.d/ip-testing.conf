server {
    listen 80 default_server;
    server_name _;

    # Docker embedded DNS — required for variable-based proxy_pass to resolve service hostnames
    resolver 127.0.0.11 valid=30s;

    # Security headers — mirrors production config (suzanneravenall.conf.disabled)
    # Permissions-Policy and X-Frame-Options are set here; HSTS intentionally
    # omitted on HTTP (IP-testing only, no TLS).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Medusa file-local uploads — served at /uploads/{filename}
    location /uploads/ {
        set $upstream_medusa http://medusa:9000;
        proxy_pass $upstream_medusa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $upstream_web http://web:3000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /cms {
        set $upstream_payload http://payload:3001;
        proxy_pass $upstream_payload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /n8n/ {
        set $upstream_n8n http://n8n:5678;
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass $upstream_n8n;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Medusa admin dashboard UI
    location /medusa {
        set $upstream_medusa http://medusa:9000;
        proxy_pass $upstream_medusa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Medusa auth API (login flow calls /auth/user/emailpass)
    location /auth {
        set $upstream_medusa http://medusa:9000;
        proxy_pass $upstream_medusa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell Medusa the connection is HTTPS so express-session creates the cookie.
        # Strip Secure + set SameSite=lax so Chrome stores the session cookie over HTTP.
        # Chrome rejects SameSite=None cookies without Secure — lax avoids that.
        # IP-based testing only — remove both lines once real SSL is live.
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_http_version 1.1;
    }

    # Medusa admin API (admin UI calls /admin/... directly)
    location /admin {
        set $upstream_medusa http://medusa:9000;
        proxy_pass $upstream_medusa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Treat as HTTPS so Medusa session validation accepts the request.
        # Strip Secure + fix SameSite for HTTP testing.
        # IP-based testing only — remove both lines once real SSL is live.
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_http_version 1.1;
    }

    # Rewrite /api/auth/* → /auth/* — needed by migration scripts and external API clients
    location /api/auth {
        set $upstream_medusa http://medusa:9000;
        rewrite ^/api/auth/?(.*)$ /auth/$1 break;
        proxy_pass $upstream_medusa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_http_version 1.1;
    }

    # Rewrite /api/store/* → /store/* before proxying to Medusa (store routes live at /store/*)
    location /api/store {
        set $upstream_medusa http://medusa:9000;
        rewrite ^/api/store/?(.*)$ /store/$1 break;
        proxy_pass $upstream_medusa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Rewrite /api/admin/* → /admin/* before proxying to Medusa (admin routes live at /admin/*)
    # TODO production: restrict by IP or add auth_basic before DNS cutover
    location /api/admin {
        set $upstream_medusa http://medusa:9000;
        rewrite ^/api/admin/?(.*)$ /admin/$1 break;
        proxy_pass $upstream_medusa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
