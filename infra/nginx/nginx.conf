worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Members carry legacy hosted-Supabase session cookies (sb-mjhwonoekokxyisfljtj-*)
    # alongside the new self-hosted session — the combined Cookie header can exceed
    # the 8k default, making nginx 400 every page request (looks like a post-login hang).
    large_client_header_buffers 4 32k;

    # Gzip compression — enabled for all text-based responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Docker's internal DNS — re-resolve service names every 30s so Nginx picks
    # up new container IPs after a rebuild without requiring a manual reload.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
