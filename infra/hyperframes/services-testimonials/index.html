<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
      }
      .scene video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
      }
    </style>
  </head>
  <body>
    <!--
      Services testimonial montage — faces only, no text.
      6 portrait smile clips (4.04s each) crossfading across a 24s timeline.
      Converted from the preview-style composition into a conformant HyperFrames
      composition: declared dimensions + GSAP timeline + per-clip data-start/data-duration.
      Clips are copied alongside this file (./smile-N.mp4, gitignored) so the
      render server resolves them without parent-directory traversal.
    -->
    <div
      id="root"
      data-composition-id="services-testimonials"
      data-start="0"
      data-duration="24"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene" id="scene-0" data-start="0" data-duration="4.8" data-track-index="0">
        <video class="clip" src="./smile-1.mp4" muted playsinline data-start="0" data-duration="4.8" data-track-index="0"></video>
      </div>
      <div class="scene" id="scene-1" data-start="4" data-duration="4.8" data-track-index="1">
        <video class="clip" src="./smile-2.mp4" muted playsinline data-start="4" data-duration="4.8" data-track-index="1"></video>
      </div>
      <div class="scene" id="scene-2" data-start="8" data-duration="4.8" data-track-index="2">
        <video class="clip" src="./smile-3.mp4" muted playsinline data-start="8" data-duration="4.8" data-track-index="2"></video>
      </div>
      <div class="scene" id="scene-3" data-start="12" data-duration="4.8" data-track-index="3">
        <video class="clip" src="./smile-4.mp4" muted playsinline data-start="12" data-duration="4.8" data-track-index="3"></video>
      </div>
      <div class="scene" id="scene-4" data-start="16" data-duration="4.8" data-track-index="4">
        <video class="clip" src="./smile-5.mp4" muted playsinline data-start="16" data-duration="4.8" data-track-index="4"></video>
      </div>
      <div class="scene" id="scene-5" data-start="20" data-duration="4" data-track-index="5">
        <video class="clip" src="./smile-6.mp4" muted playsinline data-start="20" data-duration="4" data-track-index="5"></video>
      </div>
    </div>

    <script>
      // Single, explicit GSAP timeline (paused — HyperFrames seeks it frame by frame).
      // Total length is pinned to 24s so the render stops exactly at the last frame.
      // Each person holds ~4s; adjacent scenes crossfade over 0.8s at every boundary.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const FADE = 0.8;
      const E = 'power1.inOut';

      // Start every scene hidden.
      tl.set(['#scene-0', '#scene-1', '#scene-2', '#scene-3', '#scene-4', '#scene-5'], { opacity: 0 }, 0);

      // Scene 1 — 0–4s
      tl.to('#scene-0', { opacity: 1, duration: FADE, ease: E }, 0);
      // Crossfade 1 → 2 at 4s (4–8s)
      tl.to('#scene-0', { opacity: 0, duration: FADE, ease: E }, 4);
      tl.to('#scene-1', { opacity: 1, duration: FADE, ease: E }, 4);
      // Crossfade 2 → 3 at 8s (8–12s)
      tl.to('#scene-1', { opacity: 0, duration: FADE, ease: E }, 8);
      tl.to('#scene-2', { opacity: 1, duration: FADE, ease: E }, 8);
      // Crossfade 3 → 4 at 12s (12–16s)
      tl.to('#scene-2', { opacity: 0, duration: FADE, ease: E }, 12);
      tl.to('#scene-3', { opacity: 1, duration: FADE, ease: E }, 12);
      // Crossfade 4 → 5 at 16s (16–20s)
      tl.to('#scene-3', { opacity: 0, duration: FADE, ease: E }, 16);
      tl.to('#scene-4', { opacity: 1, duration: FADE, ease: E }, 16);
      // Crossfade 5 → 6 at 20s (20–24s)
      tl.to('#scene-4', { opacity: 0, duration: FADE, ease: E }, 20);
      tl.to('#scene-5', { opacity: 1, duration: FADE, ease: E }, 20);
      // Scene 6 fades out to black, ending exactly at 24s.
      tl.to('#scene-5', { opacity: 0, duration: FADE, ease: E }, 23.2);

      // Pin the timeline's end to 24s so its total duration is unambiguous.
      tl.set({}, {}, 24);

      window.__timelines['services-testimonials'] = tl;
    </script>
  </body>
</html>
