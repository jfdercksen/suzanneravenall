<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=1920, height=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px; height: 1080px;
      background: #000;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .scene.active { opacity: 1; }

    .scene video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

<div class="scene" id="scene-1">
  <video src="../../apps/web/public/videos/portraits/smile-1.mp4"
         muted playsinline></video>
</div>

<div class="scene" id="scene-2">
  <video src="../../apps/web/public/videos/portraits/smile-2.mp4"
         muted playsinline></video>
</div>

<div class="scene" id="scene-3">
  <video src="../../apps/web/public/videos/portraits/smile-3.mp4"
         muted playsinline></video>
</div>

<div class="scene" id="scene-4">
  <video src="../../apps/web/public/videos/portraits/smile-4.mp4"
         muted playsinline></video>
</div>

<div class="scene" id="scene-5">
  <video src="../../apps/web/public/videos/portraits/smile-5.mp4"
         muted playsinline></video>
</div>

<div class="scene" id="scene-6">
  <video src="../../apps/web/public/videos/portraits/smile-6.mp4"
         muted playsinline></video>
</div>

<script>
  const scenes = document.querySelectorAll('.scene');
  let current = 0;

  scenes[0].classList.add('active');
  scenes[0].querySelector('video').play();

  function nextScene() {
    scenes[current].classList.remove('active');
    current = (current + 1) % scenes.length;
    scenes[current].classList.add('active');
    const video = scenes[current].querySelector('video');
    video.currentTime = 0;
    video.play();
  }

  setInterval(nextScene, 4000);
</script>
</body>
</html>
