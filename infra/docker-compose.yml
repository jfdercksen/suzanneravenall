# Production Docker Compose stack — suzanneravenall.com
# Docker Compose v2 syntax — no version key required
# All services communicate via the suzanne_network bridge.
# Never expose meilisearch or sentry ports to the host in production.

services:

  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy and SSL termination (entry point for all traffic)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - medusa_uploads:/app/uploads:ro
      # Next.js chunks published by the web container (KI092)
      - web_static:/var/www/next/_next/static:ro
    depends_on:
      web:
        condition: service_healthy
      payload:
        condition: service_healthy
      calcom:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - suzanne_network

  # ---------------------------------------------------------------------------
  # PostgreSQL — shared database for Medusa, Payload, and n8n
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - suzanne_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ---------------------------------------------------------------------------
  # Medusa.js v2 — commerce backend
  # ---------------------------------------------------------------------------
  medusa:
    build:
      context: ..
      dockerfile: apps/medusa/Dockerfile
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - medusa_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${MEDUSA_DATABASE_URL}
      NODE_ENV: production
      # KI090: V8 defaults to a 524 MB heap here and idle Medusa sits near it; leave headroom inside the 1g limit
      NODE_OPTIONS: --max-old-space-size=768
      MEDUSA_ADMIN_ONBOARDING_TYPE: ${MEDUSA_ADMIN_ONBOARDING_TYPE}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SENTRY_DSN: ${SENTRY_DSN_MEDUSA}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      ADMIN_CORS: ${ADMIN_CORS:-http://169.239.180.49}
      STORE_CORS: ${STORE_CORS:-http://169.239.180.49}
      AUTH_CORS: ${AUTH_CORS:-http://169.239.180.49}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}
      PAYPAL_SANDBOX: ${PAYPAL_SANDBOX:-false}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      WEB_BASE_URL: http://web:3000
      NEXT_PUBLIC_CAL_URL: ${NEXT_PUBLIC_CAL_URL:-}
      CALCOM_SESSION_BOOKING_URL: ${CALCOM_SESSION_BOOKING_URL:-}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_ADMIN_KEY: ${MEILISEARCH_ADMIN_KEY}
      MEDUSA_API_TOKEN: ${MEDUSA_API_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      VTIGER_URL: ${VTIGER_URL:-}
      VTIGER_USERNAME: ${VTIGER_USERNAME:-}
      VTIGER_ACCESS_KEY: ${VTIGER_ACCESS_KEY:-}
      VIBE_MARKETING_WEBHOOK_URL: ${VIBE_MARKETING_WEBHOOK_URL:-}
      N8N_THINKIFIC_ENROLLMENT_WEBHOOK_URL: ${N8N_THINKIFIC_ENROLLMENT_WEBHOOK_URL:-}
      # n8n migration steps 1 and 2 (packages/integrations/README.md). Default
      # n8n = unchanged behaviour; code = our own durable queue; off = nobody.
      AUTOMATION_THINKIFIC: ${AUTOMATION_THINKIFIC:-n8n}
      AUTOMATION_ORDER_VTIGER: ${AUTOMATION_ORDER_VTIGER:-n8n}
      # n8n migration step 4: abandoned-cart reminders (cart_recovery rows +
      # jobs/cart-recovery.ts). Empty delays = "1h,23h,48h".
      AUTOMATION_CART_RECOVERY: ${AUTOMATION_CART_RECOVERY:-n8n}
      CART_RECOVERY_DELAYS: ${CART_RECOVERY_DELAYS:-}
      # Intake forms (H-12): order -> web /api/intake/orders, hourly reminders.
      # code (default) | off. Empty delays = "1d,3d,5d,8d,11d,14d" (web app).
      AUTOMATION_INTAKE: ${AUTOMATION_INTAKE:-code}
      INTAKE_REMINDER_DELAYS: ${INTAKE_REMINDER_DELAYS:-}
      INTAKE_SWEEP_SINCE: ${INTAKE_SWEEP_SINCE:-}
      # KI095 safety net: paid carts that never became a paid order are repaired
      # once or reported to staff (jobs/payment-reconcile.ts). code (default) | off.
      AUTOMATION_PAYMENT_RECONCILE: ${AUTOMATION_PAYMENT_RECONCILE:-code}
      AUTOMATION_ALERT_EMAIL: ${AUTOMATION_ALERT_EMAIL:-}
      # Medusa's own dry-run switch, separate from the web app's
      # AUTOMATION_DRY_RUN so a shadow run here never pauses live lead sync.
      AUTOMATION_DRY_RUN: ${MEDUSA_AUTOMATION_DRY_RUN:-false}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-}
      THINKIFIC_API_KEY: ${THINKIFIC_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    networks:
      - suzanne_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Next.js 14 — public-facing web app
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_MEDUSA_URL: ${NEXT_PUBLIC_MEDUSA_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT}
        NEXT_PUBLIC_CAL_URL: ${NEXT_PUBLIC_CAL_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MEDUSA_REGION_ID: ${NEXT_PUBLIC_MEDUSA_REGION_ID}
        NEXT_PUBLIC_MEDUSA_REGION_USD_ID: ${NEXT_PUBLIC_MEDUSA_REGION_USD_ID}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_MEDUSA_URL: ${NEXT_PUBLIC_MEDUSA_URL}
      MEDUSA_BACKEND_URL: http://medusa:9000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_ADMIN_KEY: ${MEILISEARCH_ADMIN_KEY}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      QUIZ_NOTIFY_EMAIL: ${QUIZ_NOTIFY_EMAIL:-}
      # Intake forms (H-12): completed forms go here (else CONTACT_NOTIFY_EMAIL,
      # else support@ravenallinstitute.com); same delays as medusa.
      INTAKE_NOTIFY_EMAIL: ${INTAKE_NOTIFY_EMAIL:-}
      INTAKE_REMINDER_DELAYS: ${INTAKE_REMINDER_DELAYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      SENTRY_DSN_WEB: ${SENTRY_DSN_WEB}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}
      PAYPAL_SANDBOX: ${PAYPAL_SANDBOX:-false}
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID}
      BUNNY_CDN_HOSTNAME: ${BUNNY_CDN_HOSTNAME:-iframe.mediadelivery.net}
      BUNNY_STREAM_SIGNING_KEY: ${BUNNY_STREAM_SIGNING_KEY}
      BUNNY_WEBHOOK_SECRET: ${BUNNY_WEBHOOK_SECRET}
      VTIGER_URL: ${VTIGER_URL:-}
      VTIGER_USERNAME: ${VTIGER_USERNAME:-}
      VTIGER_ACCESS_KEY: ${VTIGER_ACCESS_KEY:-}
      # n8n migration step 3: leads go to Vtiger from our own code (code),
      # from the old n8n webhook (n8n) or nowhere (off). Never both.
      LEADS_AUTOMATION: ${LEADS_AUTOMATION:-code}
      # Memberships on sale (KI071/KI072). Off for launch; see infra/.env.example.
      MEMBERSHIPS_ENABLED: ${MEMBERSHIPS_ENABLED:-false}
      AUTOMATION_ALERT_EMAIL: ${AUTOMATION_ALERT_EMAIL:-}
      AUTOMATION_DRY_RUN: ${AUTOMATION_DRY_RUN:-false}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-}
      VIBE_MARKETING_WEBHOOK_URL: ${VIBE_MARKETING_WEBHOOK_URL:-}
      CALCOM_WEBHOOK_SECRET: ${CALCOM_WEBHOOK_SECRET}
      # The Cal.com user page the session-30/-45/-60/-90 events hang off, for the
      # confirmation page's Book Your Session button (KI079); same value as medusa.
      CALCOM_SESSION_BOOKING_URL: ${CALCOM_SESSION_BOOKING_URL:-}
      SAGE_CLIENT_ID: ${SAGE_CLIENT_ID}
      SAGE_CLIENT_SECRET: ${SAGE_CLIENT_SECRET}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_REGION_ID: ${NEXT_PUBLIC_MEDUSA_REGION_ID}
      NEXT_PUBLIC_MEDUSA_REGION_USD_ID: ${NEXT_PUBLIC_MEDUSA_REGION_USD_ID}
      # Master switch for USD pricing (D021). On by default since 21 Oct 2026:
      # visitors outside South Africa see USD and pay with PayPal. "false"
      # puts everyone on ZAR and hides the currency switcher.
      MEDUSA_USD_REGION_ENABLED: ${MEDUSA_USD_REGION_ENABLED:-true}
      # IP-to-country database for the currency rule (D021), refreshed monthly
      # by infra/scripts/geoip/update-dbip.sh. Missing file = browser signals only.
      GEOIP_DB_PATH: /data/geoip/dbip-country-lite.mmdb
      MEDUSA_API_TOKEN: ${MEDUSA_API_TOKEN}
      # Medusa v2 admin auth for the member portal (KI078): a secret API key
      # (sk_) as Basic auth, else an emailpass login with the admin account.
      MEDUSA_API_KEY: ${MEDUSA_API_KEY:-}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-}
      EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET}
      COMPANY_PHYSICAL_ADDRESS: ${COMPANY_PHYSICAL_ADDRESS:-}
      COMPANY_REGISTRATION_NUMBER: ${COMPANY_REGISTRATION_NUMBER:-}
      COMPANY_VAT_NUMBER: ${COMPANY_VAT_NUMBER:-}
    volumes:
      - ./geoip:/data/geoip:ro
      # Chunks for nginx to serve (KI092); filled at container start
      - web_static:/app/shared-static
    networks:
      - suzanne_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Payload CMS — content management
  # ---------------------------------------------------------------------------
  payload:
    build:
      context: ..
      dockerfile: apps/payload/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      DATABASE_URL: ${PAYLOAD_DATABASE_URL}
      PAYLOAD_URL: ${PAYLOAD_URL}
      NODE_ENV: ${NODE_ENV}
    networks:
      - suzanne_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/cms/admin || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ---------------------------------------------------------------------------
  # MeiliSearch — internal search engine (never exposed publicly)
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    # No host port mapping — internal only. Use docker exec or the web service
    # to interact with MeiliSearch from outside the container network.
    expose:
      - "7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV}
    networks:
      - suzanne_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ---------------------------------------------------------------------------
  # n8n — workflow automation
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:2.20.9
    restart: unless-stopped
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: 169.239.180.49
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: http://169.239.180.49/n8n
      WEBHOOK_URL: http://169.239.180.49/n8n
      N8N_SECURE_COOKIE: "false"
      DB_TYPE: ${DB_TYPE}
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      # Sage credentials — accessed in n8n workflow via $env.SAGE_*
      SAGE_EMAIL: ${SAGE_EMAIL}
      SAGE_PASSWORD: ${SAGE_PASSWORD}
      SAGE_API_KEY: ${SAGE_API_KEY}
      SAGE_COMPANY_ID: ${SAGE_COMPANY_ID}
      SAGE_API_URL: ${SAGE_API_URL:-https://accounting.sageone.co.za/api/2.0.0}
      SAGE_INCOME_ACCOUNT_ID: ${SAGE_INCOME_ACCOUNT_ID:-}
      MEDUSA_API_TOKEN: ${MEDUSA_API_TOKEN}
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # Public key: the cart-abandonment workflow reads cart status from the store API
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      VTIGER_URL: ${VTIGER_URL:-}
      VTIGER_USERNAME: ${VTIGER_USERNAME:-}
      VTIGER_ACCESS_KEY: ${VTIGER_ACCESS_KEY:-}
      THINKIFIC_API_KEY: ${THINKIFIC_API_KEY}
      # n8n 2.x denies $env in Code nodes by default; every workflow here reads its secrets that way
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # The Vtiger login hash is an md5 in a Code node; n8n disallows Node builtins unless listed
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    networks:
      - suzanne_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ---------------------------------------------------------------------------
  # Cal.com — self-hosted scheduling
  # Note: calcom/cal.com does not publish a stable semver image tag beyond
  # "latest". Pin this to a specific digest in production once the initial
  # deployment is validated, e.g. calcom/cal.com@sha256:<digest>.
  # ---------------------------------------------------------------------------
  calcom:
    image: calcom/cal.com:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD}
      DATABASE_URL: postgresql://medusa:${POSTGRES_PASSWORD}@postgres:5432/calcom
      DATABASE_DIRECT_URL: postgresql://medusa:${POSTGRES_PASSWORD}@postgres:5432/calcom
    networks:
      - suzanne_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

# -----------------------------------------------------------------------------
# Named volumes — never use bind mounts for persistent data in production
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  meilisearch_data:
  n8n_data:
  medusa_uploads:
  web_static:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  suzanne_network:
    driver: bridge
